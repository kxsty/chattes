name: chattes
description: "note-taking app"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.13.0
  chattes_core:
    path: rust_builder
  file_picker: ^13.3.0
  open_file: ^4.0.0
  shared_preferences: ^2.5.6
  flutter_riverpod: ^3.4.3
  riverpod_lint: ^3.1.9
  riverpod_annotation: ^4.0.7
  dynamic_color: ^1.9.0
  path: ^1.9.1
  collection: ^1.19.1
  freezed_annotation: ^3.1.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.2
  freezed: ^4.0.3

flutter:
  uses-material-design: true
